<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Meta token</title>
<style>
  :root{--bg:#f6f6f4;--ink:#141414;--ink2:#555;--line:#d9d9d4;--red:#d62b2b;--ok:#1d7a3a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:520px;margin:48px auto;padding:0 16px}
  h1{font-size:22px;margin:0 0 8px}
  p{color:var(--ink2);margin:0 0 20px}
  textarea{width:100%;height:120px;padding:12px;border:1px solid var(--line);border-radius:10px;font:14px/1.4 ui-monospace,Menlo,monospace;background:#fff;resize:vertical}
  .row{display:flex;gap:10px;margin-top:12px}
  button{flex:1;padding:14px;border:0;border-radius:10px;font:600 16px system-ui,sans-serif;cursor:pointer}
  #paste{background:#fff;border:1px solid var(--line);color:var(--ink)}
  #save{background:var(--red);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  #msg{margin-top:16px;font-weight:600;min-height:24px}
  #msg.ok{color:var(--ok)} #msg.err{color:var(--red)}
</style>
</head>
<body>
<main>
  <h1>Valley Details: Meta token</h1>
  <p>Paste the access token you just generated in Events Manager, then hit Save. It goes straight to the server and gets checked with Meta. This link works once.</p>
  <textarea id="tok" placeholder="Paste the token here" autocomplete="off" spellcheck="false"></textarea>
  <div class="row">
    <button id="paste" type="button">Paste</button>
    <button id="save" type="button">Save</button>
  </div>
  <div id="msg"></div>
</main>
<script>
  const API = 'https://ouyymntxbwamvuzfdnkc.supabase.co/functions/v1/meta-purchases?action=save-token';
  const key = location.hash.slice(1);
  const tok = document.getElementById('tok'), msg = document.getElementById('msg'), save = document.getElementById('save');
  const say = (t, cls) => { msg.textContent = t; msg.className = cls || ''; };
  if (!key) { say('This link is missing its key.', 'err'); save.disabled = true; }
  document.getElementById('paste').onclick = async () => {
    try { tok.value = (await navigator.clipboard.readText()).trim(); } catch (_) { tok.focus(); say('Click the box and press Ctrl+V.', ''); }
  };
  save.onclick = async () => {
    save.disabled = true; say('Checking with Meta...', '');
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                   body: JSON.stringify({ setup: key, token: tok.value.trim() }) });
      const j = await r.json().catch(() => ({}));
      if (j.ok) { tok.value = ''; say('Saved. Meta accepted it. You can close this tab.', 'ok'); history.replaceState(null, '', location.pathname); return; }
      say(j.error || 'Something went wrong. Try again.', 'err');
    } catch (_) { say('Could not reach the server. Try again.', 'err'); }
    save.disabled = false;
  };
</script>
</body>
</html>
