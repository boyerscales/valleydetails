<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site powered down</title>
<link rel="icon" href="assets/icon.png">
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --ink: #18181a; --muted: #6b6b70; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --ink: #f2f2f0; --muted: #9a9aa0; } }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    padding: 24px; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 26px; line-height: 1.25; font-weight: 650; letter-spacing: -0.01em; }
  p { margin-top: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>This site has been powered down by BoyerScales.</h1>
  <p>Online booking here is no longer active.</p>
</main>
</body>
</html>
